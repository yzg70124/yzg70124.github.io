<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中職卡牌對戰</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <h1>⚾ 中職卡牌對戰</h1>
  
  <!-- 把按鈕放在一個區塊裡，並新增背包按鈕 -->
  <div class="nav-buttons">
  <button class="draw-btn" onclick="startDraw(1)">⚾ 單抽 (1張)</button>
  <button class="draw-btn ten-draw" onclick="startDraw(10)">🔥 十連抽 (10張)</button>
  <button id="bagBtn" onclick="showBag()">🎒 查看背包</button>
  <button id="sortBtn" onclick="sortInventory()">✨ 整理</button>
  <button id="clearBtn" onclick="clearInventory()">🗑️ 清空</button>
</div>

  
  <div id="loading" style="display:none;">球員卡撕開中...</div>
  
  <!-- 用來顯示現在是看抽卡結果還是看背包 -->
  <h2 id="sectionTitle"></h2>
  
  <div class="card-container" id="cardContainer"></div>

  <script src="script.js"></script>
</body>
</html>
